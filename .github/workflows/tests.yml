name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: filter
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    # Every other job installs the newest of everything, so a dev-tool
    # constraint that claims more than it can deliver never gets tested. This
    # one resolves the floor and runs against it. It is not hypothetical: with
    # "phpstan/phpstan": "^2.0" this job would fail, because phpstan.neon sets
    # phpVersion.max to 80500 and no PHPStan before 2.1.22 accepts it - that is
    # a configuration error, not a degraded analysis, so the run dies before
    # reading a line of code.
    #
    # Pint is deliberately absent here. It is a formatter whose rule set moves
    # between patches, so the oldest Pint can reject code the newest accepts -
    # churn rather than a defect. Linting happens once, in the analyse job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: filter
          coverage: none

      - run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/phpstan analyse --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: filter
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    # Reads src/ and reports any symbol that no declared dependency provides.
    # The packages half of that finds nothing by construction here - "require"
    # is php and ext-filter, so there is nothing to arrive transitively - and
    # the extension half is the whole reason the job exists.
    #
    # Unlike ext-json, ext-filter is NOT in the checker's default
    # php-core-extensions list, because it can still be disabled at build time
    # with --disable-filter. So this job really does vouch for it: before it was
    # declared, the checker named all nine symbols the class uses - filter_var
    # plus the eight FILTER_* constants. Verified 2026-08-28, not inferred.
    #
    # Nothing else in this workflow would catch it. PHPStan knows filter_var()
    # from its own stubs and stays silent, and the suite passes because the
    # runner has the extension.
    #
    # There is deliberately no dev-free PHPStan step beside this one. With no
    # runtime dependencies it could not fail, and a step that cannot fail reads
    # as coverage it is not providing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: filter
          coverage: none

      - run: composer install --no-dev --prefer-dist --no-progress

      # Installed outside the package so that the checker's own dependencies
      # cannot land in the tree being checked. "composer -d" does not create the
      # directory: without the mkdir the step dies with "Invalid working
      # directory specified".
      - run: |
          mkdir -p /tmp/crc
          composer -d /tmp/crc require maglnet/composer-require-checker:^4.20 --no-progress

      - run: /tmp/crc/vendor/bin/composer-require-checker check composer.json
